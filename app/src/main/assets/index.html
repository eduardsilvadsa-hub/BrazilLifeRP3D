<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brazil Life RP 3D</title>
<style>
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#info{position:absolute;top:10px;left:10px;color:white;background:#0008;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div id="info">BRAZIL LIFE RP 3D<br>Protótipo Beta</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x398c42}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,200),new THREE.MeshStandardMaterial({color:0x333333}));
road.rotation.x=-Math.PI/2;
road.position.y=.02;
scene.add(road);
const player=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0x176eb5}));
player.position.set(0,1,0);
scene.add(player);
for(let i=0;i<18;i++){
const h=5+Math.random()*12;
const building=new THREE.Mesh(new THREE.BoxGeometry(5,h,5),new THREE.MeshStandardMaterial({color:0xb5b5b5}));
building.position.set((i%2?12:-12),h/2,-i*9);
scene.add(building);
}
camera.position.set(0,5,9);
camera.lookAt(player.position);
function animate(){
requestAnimationFrame(animate);
camera.position.x=player.position.x;
camera.position.z=player.position.z+9;
camera.lookAt(player.position);
renderer.render(scene,camera);
}
animate();
addEventListener('keydown',e=>{
if(e.key==='ArrowUp'||e.key==='w')player.position.z-=1;
if(e.key==='ArrowDown'||e.key==='s')player.position.z+=1;
if(e.key==='ArrowLeft'||e.key==='a')player.position.x-=1;
if(e.key==='ArrowRight'||e.key==='d')player.position.x+=1;
});
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
